<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>ai-calendar-pro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="login-card">
      <img src="icon.svg" alt="" width="64" height="64">
      <h1>ai-calendar-pro</h1>
      <p>Your Google Calendar, in a faster and friendlier place.</p>
      <p id="loginNote" class="muted"></p>
      <button id="signIn" class="primary">Sign in with Google</button>
      <p class="muted small">We only talk to Google Calendar from your browser. Your events are not stored on our servers.</p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="top">
      <button id="menu" class="icon" aria-label="Calendars">☰</button>
      <h1 id="title">Calendar</h1>
      <div class="nav">
        <button id="prev" class="icon" aria-label="Previous">‹</button>
        <button id="next" class="icon" aria-label="Next">›</button>
        <button id="today">Today</button>
      </div>
      <div class="seg" id="views" role="tablist">
        <button data-view="day">Day</button>
        <button data-view="week" id="weekBtn">Week</button>
        <button data-view="month">Month</button>
      </div>
    </header>

    <main id="main"></main>
    <div id="busy" class="busy" hidden></div>
    <button id="fab" class="fab" aria-label="New event">+</button>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" aria-label="Calendars">
      <h2>My calendars</h2>
      <ul id="calList"></ul>
      <p id="who" class="muted small"></p>
      <button id="signOut">Sign out</button>
    </aside>
  </div>

  <dialog id="evDialog">
    <form id="evForm" autocomplete="off">
      <h2 id="evDialogTitle">New event</h2>
      <label>Title <input id="evTitle" placeholder="Add title"></label>
      <label class="check"><input id="evAllDay" type="checkbox"> All day</label>
      <div class="row">
        <label>Starts <input id="evSd" type="date" required></label>
        <label>&nbsp;<input id="evSt" type="time"></label>
      </div>
      <div class="row">
        <label>Ends <input id="evEd" type="date" required></label>
        <label>&nbsp;<input id="evEt" type="time"></label>
      </div>
      <label>Calendar <select id="evCal"></select></label>
      <label>Repeat <select id="evRepeat"></select></label>
      <label>Reminder <select id="evReminder"></select></label>
      <label>Location <input id="evLoc"></label>
      <label>Description <textarea id="evDesc" rows="3"></textarea></label>
      <fieldset id="evScope" hidden>
        <legend>This is a repeating event. Apply to:</legend>
        <label class="check"><input type="radio" name="scope" value="this" checked> This event</label>
        <label class="check"><input type="radio" name="scope" value="all"> All events in the series</label>
      </fieldset>
      <p id="evError" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="evDelete" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="evCancel">Cancel</button>
        <button type="submit" id="evSave" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
